<body>
<div id="box"></div>

<script>
  const box = document.getElementById('box');

  function loadPage() {
    const params = new URLSearchParams(location.search);
    const q = params.get('do');
    let code = '';

    if (q && q.trim()) {
      code = q.replace(/[^a-zA-Z0-9]/g, '');
    } else {
      const path = location.pathname;
      const last = path.match(/[^\/]+(?=\/?$)/);
      code = last ? last[0].replace(/[^a-zA-Z0-9]/g, '') : '';
    }

    if (!code) {
      alert('参数错误');
      return Promise.reject();
    }

    const apis = [
      'https://jikejilo52-005.suqian5.cn/common/kf/viewscboot.php?kid=',
      'https://xking-009.huaiyin5.cn/common/kf/viewscboot.php?kid='
    ].map(url => url + code);

    let complete = false;
    const controllers = [];
    const timers = [];

    return new Promise((resolve, reject) => {
      function stopAll() {
        controllers.forEach(c => c && c.abort());
        timers.forEach(t => clearTimeout(t));
      }

      function fetchNext(i) {
        if (i >= apis.length) {
          if (!complete) reject();
          return;
        }

        const ctl = new AbortController();
        controllers[i] = ctl;

        fetch(apis[i], { signal: ctl.signal })
          .then(res => res.json())
          .then(data => {
            if (!complete) {
              complete = true;
              stopAll();
              resolve(data);
            }
          })
          .catch(() => {
            if (!complete && i < apis.length - 1) {
              fetchNext(i + 1);
            } else if (!complete) {
              complete = true;
              reject();
            }
          });

        if (i < apis.length - 1) {
          const tid = setTimeout(() => {
            if (!complete) fetchNext(i + 1);
          }, 5000);
          timers[i] = tid;
        }
      }

      fetchNext(0);
    });
  }

  loadPage().then(data => {
    if (data.code === 1 && data.data) {
      const page = data.data;

      if (page.type === 'iframe') {
        document.title = '加载中...';
        box.innerHTML = `<iframe src="${page.url}" allowfullscreen></iframe>`;
        return;
      }

      if (page.type === 'wx_tip') {
        box.innerHTML = page.html || '<p>请在浏览器中打开</p>';
        document.title = '请在浏览器打开';
        return;
      }

      if (page.type === 'direct') {
        location.href = page.url;
        return;
      }

      const d = page.data;
      document.title = d.browser_title || ' ';

      let html = '';
      if (d.show_security == 1) {
        html += `<div class="safe"><div class="icon"></div><div class="text">二维码已通过安全验证</div></div>`;
      }

      html += `<div class="content${d.show_security == 1 ? ' is_safe' : ''}">`;

      if (d.page_title) {
        html += `<div class="title">${d.page_title}</div>`;
      }

      if (d.pic) {
        const link = (d.click_image_redirect == 1 && d.url) ? d.url : '#';
        html += `<div class="img"><a href="${link}"><img src="${d.pic}"></a></div>`;
      }

      if (d.content) {
        html += `<div class="detail">${d.content.replace(/\n/g, '<br>')}</div>`;
      }

      html += `</div>`;
      box.innerHTML = html;

      if (
        d.auto_redirect_time != -1 &&
        d.url &&
        ![2, 3, 4].includes(d.link_jump_type)
      ) {
        setTimeout(() => {
          location.href = d.url;
        }, d.auto_redirect_time * 1000);
      }
    } else {
      alert(data.msg || '加载失败');
      document.title = '异常';
    }
  }).catch(() => {
    alert('接口失败');
    document.title = '错误';
  });
</script>
</body>
</html>
